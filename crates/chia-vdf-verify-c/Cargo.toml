[package]
name = "chia-vdf-verify-c"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "C FFI for chia-vdf-verify, mirroring chiavdf's c_wrapper.h verification API"
authors = ["Richard Kiss <him@richardkiss.com>"]
homepage = "https://github.com/Chia-Network/chia_rs"
repository = "https://github.com/Chia-Network/chia_rs"
readme = "README.md"

[lints]
workspace = true

[lib]
name = "chia_vdf_verify_c"
crate-type = ["cdylib", "staticlib", "rlib"]
bench = false

[dependencies]
chia-vdf-verify = { workspace = true }
malachite-nz = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
